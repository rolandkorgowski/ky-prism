name: Real RHEL validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rhel:
    strategy:
      fail-fast: false
      matrix:
        os: [rhel9, rhel10]
    runs-on: [self-hosted, linux, '${{ matrix.os }}']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check administrator-provisioned dependencies
        run: bash install.sh --check
      - name: Build and test without changing repositories
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPRISM_WITH_NVJPEG=AUTO
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --output-log build/ctest.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-${{ matrix.os }}-validation
          path: build/ctest.log
